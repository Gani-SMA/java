<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Add user — FoodFrenzy</title>
	<link rel="stylesheet" th:href="@{/css/Add_User.css}" />
</head>
<body>
	<div class="addUser">
		<h2>Add new user</h2>
		<form th:action="@{/addingUser}" method="post">
			<b>Name</b>
			<input type="text" name="uname" placeholder="Full name" required />
			<b>Email</b>
			<input type="email" name="uemail" placeholder="email@example.com" required />
			<b>Phone number</b>
			<input type="tel" name="unumber" placeholder="10-digit number" pattern="[0-9]{10}" required />
			<input type="hidden" name="upassword" value="2330" />
			<button type="submit">Add user</button>
		</form>
		<a href="/admin/services">← Back to dashboard</a>
	</div>
</body>
</html>
