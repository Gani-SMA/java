<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Add admin — FoodFrenzy</title>
	<link rel="stylesheet" th:href="@{/css/Add_Admin.css}" />
</head>
<body>
	<div class="addAdmin">
		<h2>Add new admin</h2>
		<form th:action="@{/addingAdmin}" method="post">
			<b>Name</b>
			<input type="text" name="adminName" placeholder="Full name" minlength="2" required />
			<b>Email</b>
			<input type="email" name="adminEmail" placeholder="email@example.com" required />
			<b>Phone number</b>
			<input type="tel" name="adminNumber" placeholder="10-digit number" pattern="[0-9]{10}" required />
			<input type="hidden" name="adminPassword" value="1234" />
			<button type="submit">Add admin</button>
		</form>
		<a href="/admin/services">← Back to dashboard</a>
	</div>
</body>
</html>
