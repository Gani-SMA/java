<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>FoodFrenzy — Order</title>
	<link rel="stylesheet" th:href="@{/css/BuyProduct.css}" />
</head>

<body>
	<div class="welcome">
		<marquee direction="right" behaviour="slide" scrollamount="15" loop="1">
			Welcome back, <span th:text="${name}"></span>
		</marquee>
	</div>

	<div class="nav-links">
		<a href="/login" class="nav-back">← Back</a>
		<a href="/logout" class="nav-logout">Logout</a>
	</div>

	<center>
		<form th:action="@{/product/search}" method="post" class="searchInput">
			<h1>Search for a dish</h1>
			<input type="text" name="productName" required placeholder="e.g. Chicken Biryani" />
			<button type="submit">Search</button>
			<smal th:text="${message}"></smal>
		</form>

		<div th:if="${product != null}" class="details">
			<form th:action="@{/product/order}" th:object="${product}" method="post">
				<b>Product name</b>
				<input type="text" name="oName" th:value="${product.pname}" readonly />
				<b>Price (₹)</b>
				<input type="text" name="oPrice" th:value="${product.pprice}" readonly />
				<b>Quantity (kg)</b>
				<input type="number" placeholder="Minimum: 1" min="1" name="oQuantity" />
				<button type="submit">Place order</button>
			</form>
		</div>

		<div th:if="${orders != null and !#lists.isEmpty(orders)}" class="details">
			<h2>Your orders</h2>
			<table>
				<thead>
					<tr>
						<th>Item</th>
						<th>Price</th>
						<th>Qty</th>
						<th>Total</th>
						<th>Date</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="order : ${orders}">
						<td th:text="${order.oName}"></td>
						<td th:text="'₹' + ${order.oPrice}"></td>
						<td th:text="${order.oQuantity}"></td>
						<td th:text="'₹' + ${order.totalAmmout}"></td>
						<td th:text="${#dates.format(order.orderDate, 'dd MMM yyyy')}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</center>
</body>

</html>
