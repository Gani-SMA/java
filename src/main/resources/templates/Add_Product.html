<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Add product — FoodFrenzy</title>
	<link rel="stylesheet" th:href="@{/css/Add_Product.css}" />
</head>
<body>
	<div class="addProducts">
		<h2>Add new product</h2>
		<form th:action="@{/addingProduct}" method="post">
			<b>Product name</b>
			<input type="text" name="pname" placeholder="e.g. Chicken Biryani" required />
			<b>Price (₹)</b>
			<input type="number" name="pprice" placeholder="e.g. 410" step="0.01" required />
			<b>Description</b>
			<textarea name="pdescription" rows="3" placeholder="Short description..."></textarea>
			<button type="submit">Add product</button>
		</form>
		<a href="/admin/services">← Back to dashboard</a>
	</div>
</body>
</html>
